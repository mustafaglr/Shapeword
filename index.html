<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Kelime yaz, çizdiğin yol blok olsun, tahtada patlat. Türkçe kelime ve blok bulmacası.">
<meta name="theme-color" content="#1B1838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shapeword">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shapeword</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="gamebg" aria-hidden="true"></div>
<main id="app" hidden>
  <div class="hud">
    <button class="round" id="back" aria-label="Haritaya dön">‹</button>
    <div class="goals" id="goals" aria-label="Hedefler"></div>
    <button class="round" id="help" aria-label="Bu bölümde ne yapmalıyım?">?</button>
    <div class="moves" id="moves"><strong id="moves-n">0</strong><small id="moves-l">hamle</small></div>
  </div>
  <div class="field" id="field">
    <div class="fieldhead"><span class="tagline" id="tagline"></span><span class="tagline" id="t-sub"></span></div>
    <div class="wordline msg" id="wordline" aria-live="polite">Harfleri kaydırıp kelime yaz</div>
    <div class="gridwrap" id="gridwrap" aria-label="Harf alanı">
      <svg class="trace" id="trace" aria-hidden="true"></svg>
    </div>
  </div>
  <div class="hand" id="hand" aria-label="Blokların"></div>
  <div class="board" id="board" aria-label="Tahta"></div>
  <div class="boosters" id="boosters"></div>
</main>

<section class="screen home" id="landing" hidden>
  <div id="homebg" aria-hidden="true"></div>
  <div class="homeinner">
    <div class="hometop">
      <div class="logo" aria-label="Shapeword"><span>S</span><span>h</span><span>a</span><span>p</span><span>e</span><span>w</span><span>o</span><span>r</span><span>d</span></div>
      <button class="round" id="gear" aria-label="Ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="homemid" id="homemid"></div>
    <div class="sheet" id="homesheet"></div>
  </div>
</section>

<section class="screen mapscreen" id="mapview" hidden>
  <div class="maphud"><button class="round" id="map-back" aria-label="Ana ekran">‹</button><span class="chip" id="map-stars">★ 0</span></div>
  <div class="mapinner" id="mapinner"></div>
  <button class="b3 blue jump" id="map-jump">Bölümüme git</button>
</section>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="overlay" id="ov" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="words-tr.js" charset="utf-8"></script>
<script src="core.js" charset="utf-8"></script>
<script src="scenes.js" charset="utf-8"></script>
<script src="sounds.js" charset="utf-8"></script>
<script src="config.js" charset="utf-8"></script><!-- cloud save settings; only the GitHub Pages copy has this file -->
<script src="app.js" charset="utf-8"></script>
</body>
</html>
