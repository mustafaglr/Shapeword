<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shapeword</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700&display=swap">
<style>
/* One deliberate game look (no light/dark switch): illustrated worlds behind everything, frosted dark glass for the HUD,
   chunky 3D buttons, white cards for dialogs. Screens: home (hero scene + play sheet), saga map, game. */
:root {
  color-scheme: dark;
  --night: #1B1838; --glass: rgba(24, 21, 52, .62); --glass-line: rgba(255, 255, 255, .16);
  --text: #FFFFFF; --soft: rgba(255, 255, 255, .74);
  --card: #FFFFFF; --ink: #262150; --muted: #6E6A93; --well: #EEF0F8; --line: #DEE1EE;
  --yellow: #FFC93C; --yellow-d: #D48A06; --blue: #4D7CFE; --blue-d: #2C53C4; --green: #2BC48A; --green-d: #198C60; --red: #F25F5C; --red-d: #B83A37; --gold: #F5B700;
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --ui: "Inter", system-ui, -apple-system, sans-serif;
}
html, body { overscroll-behavior: none; height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--ui); font-size: 15px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 6px 12px; box-sizing: border-box; }
button { font-family: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* ---------- chunky buttons ---------- */
.b3 { --c: var(--yellow); --d: var(--yellow-d); --fg: #3A2600; border: 0; border-radius: 18px; padding: 13px 18px 11px; cursor: pointer; background: var(--c); color: var(--fg);
  font: 700 1.05rem var(--display); letter-spacing: .02em; box-shadow: 0 5px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.45), 0 8px 16px rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s; }
.b3:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.45); }
.b3.blue { --c: var(--blue); --d: var(--blue-d); --fg: #fff; } .b3.green { --c: var(--green); --d: var(--green-d); --fg: #fff; } .b3.red { --c: var(--red); --d: var(--red-d); --fg: #fff; }
.b3.ghost { --c: var(--well); --d: #C9CDE0; --fg: var(--ink); box-shadow: 0 4px 0 var(--d); }
.b3.xl { font-size: 1.45rem; padding: 16px 20px 14px; border-radius: 22px; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff; font: 700 1.3rem var(--display);
  background: var(--glass); box-shadow: inset 0 0 0 1.5px var(--glass-line), 0 4px 10px rgba(0,0,0,.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.round svg { width: 22px; height: 22px; }
.round:active { transform: scale(.94); }

/* ---------- game screen ---------- */
#gamebg, #homebg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
#gamebg svg, #homebg svg { width: 100%; height: 100%; display: block; }
#gamebg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,16,50,.35), rgba(20,16,50,.55) 60%, rgba(20,16,50,.75)); }
main { position: relative; z-index: 1; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.hud { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 6px; padding: 6px; border-radius: 22px; background: var(--glass); box-shadow: inset 0 0 0 1.5px var(--glass-line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.hud .round { width: 38px; height: 38px; background: rgba(255,255,255,.12); box-shadow: none; backdrop-filter: none; }
.moves { min-width: 56px; text-align: center; border-radius: 16px; padding: 4px 8px 3px; background: linear-gradient(180deg, #FFD966, #FFB627); color: #3A2600; box-shadow: 0 3px 0 var(--yellow-d), inset 0 2px 0 rgba(255,255,255,.5); }
.moves strong { display: block; font: 700 1.5rem/1 var(--display); font-variant-numeric: tabular-nums; }
.moves small { font: 700 .56rem var(--ui); letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.moves.low { background: linear-gradient(180deg, #FF8A87, #F25F5C); color: #fff; box-shadow: 0 3px 0 var(--red-d), inset 0 2px 0 rgba(255,255,255,.4); }
.goals { display: flex; gap: 5px; justify-content: center; flex-wrap: nowrap; min-height: 38px; align-items: center; min-width: 0; }
.goal { display: flex; align-items: center; gap: 4px; padding: 3px 10px 3px 5px; border-radius: 999px; background: rgba(255,255,255,.14); font: 700 1.05rem var(--display); font-variant-numeric: tabular-nums; }
.goal svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
.goal.done { background: var(--green); }
.duel { display: grid; gap: 4px; width: 100%; }
.duel .row { display: grid; grid-template-columns: 50px 1fr 40px; align-items: center; gap: 6px; font: 600 .74rem var(--ui); }
.duel .row span:last-child { text-align: right; font: 700 .92rem var(--display); font-variant-numeric: tabular-nums; }
.bar { height: 9px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--yellow); transition: width .3s; }
.bar.rival i { background: var(--red); }

/* letter field: a framed panel in the world's colours */
.field { position: relative; border-radius: 26px; padding: 8px 12px 12px; background: linear-gradient(160deg, var(--c1), var(--c2)); overflow: hidden;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.28), inset 0 -10px 24px rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.3); }
.field::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.14) 1.5px, transparent 1.6px); background-size: 16px 16px; pointer-events: none; animation: drift 30s linear infinite; }
@keyframes drift { to { background-position: 160px 80px; } }
.fieldhead { position: relative; display: flex; justify-content: space-between; gap: 8px; }
.tagline { font: 700 .64rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.9); text-shadow: 0 1px 2px rgba(0,0,0,.25); font-variant-numeric: tabular-nums; }
.wordline { position: relative; min-height: 28px; display: flex; align-items: center; justify-content: center; font: 700 1.25rem var(--display); letter-spacing: .1em; text-transform: uppercase; text-align: center; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.3); }
.wordline.ok { color: #FFF4B8; text-shadow: 0 0 12px rgba(255,244,184,.8), 0 2px 3px rgba(0,0,0,.35); } .wordline.no { color: rgba(255,255,255,.6); }
.wordline.msg { font: 600 .85rem var(--ui); letter-spacing: 0; text-transform: none; color: rgba(255,255,255,.92); }
.gridwrap { position: relative; width: min(72%, 25vh); width: min(72%, 25dvh); aspect-ratio: 1; margin: 2px auto 0; touch-action: none; }
.trace { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2; }
.tile { position: absolute; left: 0; top: 0; border-radius: 50%; display: grid; place-items: center; z-index: 1; will-change: transform;
  background: radial-gradient(circle at 35% 28%, #FFFFFF 0 16%, #EEF0FA 42%, #C6CCE4 100%); color: #262150;
  box-shadow: 0 3px 0 rgba(0,0,0,.28), inset 0 -3px 6px rgba(0,0,0,.12); font-family: var(--display); font-weight: 600; text-transform: uppercase; }
.tile span { transition: transform .12s; }
.tile.gold { background: radial-gradient(circle at 35% 28%, #FFF6D0 0 14%, #FFC93C 48%, #D99400 100%); color: #3A2A00; }
.tile.bomb { background: radial-gradient(circle at 35% 28%, #6B5A8C 0 12%, #2B2240 55%, #120D1E 100%); color: #fff; box-shadow: 0 0 0 2px #FF5A4F, 0 3px 0 rgba(0,0,0,.3); }
.tile.bomb::after { content: ""; position: absolute; top: 4%; right: 10%; width: 14%; height: 14%; border-radius: 50%; background: #FF5A4F; box-shadow: 0 0 8px #FF5A4F; animation: fuse .6s ease-in-out infinite alternate; }
@keyframes fuse { to { opacity: .35; } }
.tile.crystal { background: radial-gradient(circle at 35% 28%, #F3E8FF 0 14%, #B57BFF 50%, #6D28D9 100%); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.tile.crystal::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 10px 2px rgba(181,123,255,.8); animation: glow 1.4s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .3; } }
.tile.joker { background: conic-gradient(from 30deg, #F25F5C, #FFB627, #2EC4B6, #4D7CFE, #9B5DE5, #F25F5C); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.tile.sel { box-shadow: 0 0 0 3px #fff, 0 0 18px rgba(255,255,255,.95); }
.tile.sel span { transform: scale(1.18); }
.tile.hint { animation: hint .9s ease-in-out infinite; }
@keyframes hint { 50% { box-shadow: 0 0 0 4px #fff, 0 0 22px #fff; } }

.hand { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; touch-action: none; }
.slot { height: clamp(50px, 8vh, 72px); height: clamp(50px, 8dvh, 72px); border-radius: 18px; background: var(--glass); box-shadow: inset 0 0 0 1.5px var(--glass-line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: grid; place-items: center; cursor: grab; touch-action: none; transition: opacity .15s; }
.slot.cant .mini { opacity: .35; filter: grayscale(.6); }
.slot.lifted .mini { opacity: .15; }
.mini, .drag { display: grid; gap: 2px; }
.mini i, .drag i { border-radius: 5px; display: block; position: relative; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.35); }
.mini i.bomb::after, .drag i.bomb::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: #2B2240; box-shadow: 0 0 0 2px #FF5A4F; }
.drag { position: fixed; pointer-events: none; z-index: 25; filter: drop-shadow(0 10px 12px rgba(0,0,0,.35)); }

.board { display: grid; grid-template-columns: repeat(9, 1fr); width: min(100%, 37vh); width: min(100%, 37dvh); margin: 0 auto; border-radius: 20px; padding: 5px; box-sizing: border-box; touch-action: none;
  background: rgba(255,255,255,.9); box-shadow: inset 0 0 0 3px rgba(255,255,255,.6), 0 10px 24px rgba(0,0,0,.3); }
.cell { aspect-ratio: 1; max-width: 100%; padding: 1.5px; box-sizing: border-box; }
.cell > b { display: block; width: 100%; height: 100%; border-radius: 6px; background: #E3E6F2; will-change: transform; box-shadow: inset 0 2px 3px rgba(38,33,80,.08); }
.cell.bx > b { background: #D3D8EA; }
.cell.on > b { box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.35); }
.cell.stone > b { background: radial-gradient(circle at 35% 30%, #B9BCC8, #7E8292 60%, #5B5E6E); box-shadow: inset 0 -3px 0 rgba(0,0,0,.3); border-radius: 8px; }
.cell.ice > b { background: linear-gradient(135deg, #E8F7FF 0 30%, #9FD6F7 31% 60%, #CDEBFF 61%); box-shadow: inset 0 0 0 2px #6CB8E8; }
.cell.ice.cracked > b { background: linear-gradient(135deg, transparent 0 46%, #fff 47% 50%, transparent 51%), linear-gradient(45deg, transparent 0 58%, #fff 59% 62%, transparent 63%), linear-gradient(135deg, #DDF2FF, #A9DAF7); box-shadow: inset 0 0 0 2px #8CC7EC; opacity: .9; }
.cell.ghost > b { outline: 2px dashed var(--blue); outline-offset: -2px; background: #C2D2FF; }
.cell.suggest > b { box-shadow: inset 0 0 0 3px var(--green); }

.boosters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.booster { position: relative; border: 0; border-radius: 18px; padding: 6px 4px 5px; color: #fff; cursor: pointer; font: 700 .7rem var(--ui); display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--glass); box-shadow: inset 0 0 0 1.5px var(--glass-line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.booster svg { width: 22px; height: 22px; }
.booster .n { position: absolute; top: -6px; right: -3px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--blue); color: #fff; font: 700 .72rem/20px var(--ui); padding: 0 5px; box-sizing: border-box; box-shadow: 0 2px 0 var(--blue-d); }
.booster .n.ad { background: var(--yellow); color: #3A2600; box-shadow: 0 2px 0 var(--yellow-d); }
.booster:active { transform: scale(.95); }

/* ---------- home ---------- */
.screen { position: fixed; inset: 0; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--night); }
.home { display: flex; flex-direction: column; }
.home > * { position: relative; z-index: 1; }
.homeinner { flex: 1; display: flex; flex-direction: column; max-width: 430px; width: 100%; margin: 0 auto; box-sizing: border-box;
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 14px; }
.hometop { display: flex; justify-content: space-between; align-items: center; }
.logo { display: flex; gap: 3px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.logo span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 1.05rem var(--display); color: #262150;
  background: radial-gradient(circle at 35% 28%, #FFFFFF 0 16%, #EEF0FA 42%, #C6CCE4 100%); animation: bob 2.4s ease-in-out infinite; }
.logo span:nth-child(2n) { animation-delay: .2s; } .logo span:nth-child(3n) { background: radial-gradient(circle at 35% 28%, #FFF6D0 0 14%, #FFC93C 48%, #D99400 100%); animation-delay: .4s; }
.logo span:nth-child(4n) { background: radial-gradient(circle at 35% 28%, #F3E8FF 0 14%, #B57BFF 50%, #6D28D9 100%); color: #fff; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.homemid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; min-height: 140px; }
.me { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font: 700 2.2rem var(--display); color: #fff; background: linear-gradient(160deg, #6C8CFF, #3D5BE0); box-shadow: 0 5px 0 #2C3FA8, 0 0 0 5px rgba(255,255,255,.85), 0 12px 24px rgba(0,0,0,.3); }
.hello { font: 700 1.7rem/1.1 var(--display); margin: 0; text-shadow: 0 2px 6px rgba(0,0,0,.35); text-wrap: balance; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 1.5px var(--glass-line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 700 .86rem var(--ui); font-variant-numeric: tabular-nums; }
.chip b { color: var(--yellow); }
.sheet { border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--glass); box-shadow: inset 0 0 0 1.5px var(--glass-line), 0 16px 40px rgba(0,0,0,.35); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.statrow { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tilebtn { border: 0; border-radius: 18px; padding: 10px 4px 8px; cursor: pointer; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 700 .74rem var(--ui); background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1.5px var(--glass-line); }
.tilebtn svg { width: 26px; height: 26px; }
.tilebtn:active { transform: scale(.95); }
.cloudline { font-size: .72rem; color: var(--soft); text-align: center; margin: 0; }
.nameform { display: flex; flex-direction: column; gap: 12px; }
.nameform label { font: 700 1.3rem var(--display); }
.field-in { font: 600 1.15rem var(--ui); padding: 14px 16px; border-radius: 16px; border: 0; background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; box-shadow: inset 0 2px 4px rgba(0,0,0,.12); user-select: text; -webkit-user-select: text; }

/* ---------- saga map ---------- */
.mapscreen { background: #2C6E3E; }
.maphud { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 8px; max-width: 480px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.maphud > * { pointer-events: auto; }
.mapinner { position: relative; max-width: 480px; margin: -64px auto 0; overflow: hidden; }
.mapinner > svg { position: absolute; inset: 0; display: block; }
.node { position: absolute; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; border: 0; cursor: pointer; font: 700 1.3rem var(--display); color: #fff; z-index: 2;
  background: radial-gradient(circle at 35% 28%, #8FB0FF 0 14%, #4D7CFE 55%, #2C53C4 100%); box-shadow: 0 5px 0 #1D3A94, 0 0 0 4px #fff, 0 10px 18px rgba(0,0,0,.3); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.node.done { background: radial-gradient(circle at 35% 28%, #FFF1B8 0 14%, #FFC93C 52%, #D99400 100%); color: #5A3A00; text-shadow: none; box-shadow: 0 5px 0 #A86A00, 0 0 0 4px #fff, 0 10px 18px rgba(0,0,0,.3); }
.node.joker { background: conic-gradient(from 30deg, #F25F5C, #FFB627, #2EC4B6, #4D7CFE, #9B5DE5, #F25F5C); color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.4); }
.node.locked { background: radial-gradient(circle at 35% 28%, #E6E8EF 0 14%, #B5B9C8 55%, #8C90A1 100%); color: #5D6175; box-shadow: 0 5px 0 #6B6F80, 0 0 0 4px rgba(255,255,255,.7); cursor: default; text-shadow: none; }
.node.locked svg { width: 22px; height: 22px; }
.node.current { animation: nodepulse 1.4s ease-in-out infinite; }
@keyframes nodepulse { 50% { transform: scale(1.1); } }
.nstars { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); display: flex; gap: 0; pointer-events: none; }
.nstars svg { width: 18px; height: 18px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
.nstars svg:nth-child(2) { transform: translateY(-5px); }
.pin { position: absolute; z-index: 3; width: 44px; height: 54px; margin: -66px 0 0 20px; pointer-events: none; animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.pin div { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 1.2rem var(--display); color: #fff; background: linear-gradient(160deg, #FF8FB1, #F25F5C); box-shadow: 0 0 0 3px #fff; }
.pin::after { content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); border: 9px solid transparent; border-top: 12px solid #fff; border-bottom: 0; }
.ribbon { position: absolute; left: 50%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; padding: 8px 22px; border-radius: 12px; font: 700 .9rem var(--display); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
  color: #fff; background: linear-gradient(180deg, #FF7A7A, #E04848); box-shadow: 0 4px 0 #A83131, 0 10px 18px rgba(0,0,0,.3); text-shadow: 0 2px 0 rgba(0,0,0,.2); }
.jump { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 6; }

/* ---------- floating effects ---------- */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 35; }
.fly { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 36; will-change: transform; }
.fly svg { width: 100%; height: 100%; display: block; }
.popnum { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 37; font: 700 1.5rem var(--display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 12px rgba(0,0,0,.3); white-space: nowrap; }
.bigtext { position: fixed; left: 50%; pointer-events: none; z-index: 37; font: 700 2.7rem/1 var(--display); color: var(--yellow); text-shadow: 0 4px 0 #B8801A, 0 0 22px rgba(255,201,60,.6); white-space: nowrap; }
.wave { position: fixed; left: 0; top: 0; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border: 6px solid #FFD27A; pointer-events: none; z-index: 36; }
.toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; background: var(--glass); color: #fff; padding: 9px 16px; border-radius: 999px; font: 600 .88rem var(--ui);
  box-shadow: inset 0 0 0 1.5px var(--glass-line), 0 8px 20px rgba(0,0,0,.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: 90vw; text-align: center; }

/* ---------- dialogs ---------- */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(14, 10, 40, .66); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: grid; place-items: center; overflow-y: auto; animation: fadein .2s ease-out;

  score: { name: "Puan", svg: '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#F5B700" stroke="#B8801A" stroke-width="1.2" stroke-linejoin="round"/></svg>',

  ipucu: { name: "İpucu", icon: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>' },

const star = (on, size = 44) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on ? "#FFC93C" : "#D9DCE8"}" stroke="${on ? "#C98A00" : "#B9BDCF"}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const AD_MS = 1000; // shortcut: 1 s simulated ad so testing is quick; real rewarded videos are 15-30 s.
const DUEL_SECONDS = 120, CHAIN_MS = 6000, NAMES = ["Deniz", "Ece", "Mert", "Zeynep", "Kaan", "Elif", "Can", "Selin", "Arda", "Defne"];
const pad = (n) => String(n).padStart(2, "0");
const NOW = new Date(), TODAY = `${NOW.getFullYear()}-${pad(NOW.getMonth() + 1)}-${pad(NOW.getDate())}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// ===================== profile, local + cloud save =====================
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const idOf = (name) => name.trim().replace(/\s+/g, " ").toLocaleLowerCase("tr");
const blankProfile = (name) => ({ name, id: idOf(name), stars: {}, best: {}, duelBest: 0, inv: { karistir: 2, yenile: 1, ipucu: 2, joker: 1 }, updated: Date.now() });
let profile = store.get("sw4:profile", null);
const isAdmin = () => profile && profile.id === "admin"; // the hidden switch: play under the name "admin" and every level opens, boosters are free
const inv = () => profile.inv;
const totalStars = (p = profile) => Object.values(p.stars).reduce((a, b) => a + b, 0);
const nextLevel = (p = profile) => { let n = 0; while (p.stars[n]) n++; return n; };
const unlocked = (n) => isAdmin() || n <= nextLevel();
function mergeProfiles(a, b) { // same player on two devices: best result per level wins, newer boosters win
  if (!a) return b; if (!b) return a;
  const out = { ...a, stars: { ...a.stars }, best: { ...a.best } };
  for (const [k, v] of Object.entries(b.stars || {})) out.stars[k] = Math.max(out.stars[k] || 0, v);
  for (const [k, v] of Object.entries(b.best || {})) out.best[k] = Math.max(out.best[k] || 0, v);
  out.duelBest = Math.max(a.duelBest || 0, b.duelBest || 0);
  out.inv = (b.updated || 0) > (a.updated || 0) ? { ...b.inv } : { ...a.inv };
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  return out;
}
function saveProfile() { profile.updated = Date.now(); store.set("sw4:profile", profile); cloudSaveSoon(); }

// Cloud: one JSONBin bin holds every player under its name. Works on the GitHub Pages copy; the Claude preview cannot reach other sites.
// shortcut: last-write-wins per bin and no login; fine for testing with friends, needs a real backend before launch.
const CLOUD = window.SW_CLOUD && window.SW_CLOUD.url ? window.SW_CLOUD : null;
let cloudInfo = CLOUD ? "Bulut: bağlanıyor…" : "Bulut kapalı: kayıt sadece bu cihazda", cloudPlayers = null, saveTimer = null;
async function cloudGet() {
  const r = await fetch(CLOUD.url + "/latest", { headers: { [CLOUD.header || "X-Master-Key"]: CLOUD.key, "X-Bin-Meta": "false" }, cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  return data && data.app === "shapeword" && data.players ? data : { app: "shapeword", players: {} };
}
async function cloudPut(data) {
  const r = await fetch(CLOUD.url, { method: "PUT", headers: { "Content-Type": "application/json", [CLOUD.header || "X-Master-Key"]: CLOUD.key }, body: JSON.stringify(data) });
  if (!r.ok) throw new Error("HTTP " + r.status);
}
const stamp = () => new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
async function cloudSync() { // pull, merge both ways, push
  if (!CLOUD || !profile) return;
  try {
    const all = await cloudGet(), mine = all.players[profile.id];
    const justReset = profile.resetAt && (!mine || profile.resetAt > (mine.updated || 0)); // a reset overwrites the cloud copy instead of merging it back
    if (!justReset) profile = mergeProfiles(profile, mine);
    store.set("sw4:profile", profile);
    all.players[profile.id] = { ...profile }; await cloudPut(all);
    cloudPlayers = all.players; cloudInfo = `Bulut: kaydedildi ${stamp()}`;
  } catch (e) { cloudInfo = "Bulut: bağlantı yok, kayıt bu cihazda duruyor"; }
}
function cloudSaveSoon() { if (!CLOUD) return; clearTimeout(saveTimer); saveTimer = setTimeout(cloudSync, 1200); }
async function cloudPeek() { if (!CLOUD) return null; try { const all = await cloudGet(); cloudPlayers = all.players; return all; } catch { cloudInfo = "Bulut: bağlantı yok"; return null; } }

// ===================== effects =====================
const fx = $("fx"), fctx = fx.getContext("2d"); let parts = [], fxOn = false, fxLast = 0;
function fxResize() { const d = devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", () => { fxResize(); layoutTiles(); }); fxResize();
function burst(x, y, color, n, power = 1) {
  if (RM) return;
  for (let k = 0; k < n; k++) { const life = 0.55 + Math.random() * 0.45; parts.push({ x, y, vx: (Math.random() - 0.5) * 460 * power, vy: (-Math.random() * 420 - 60) * power, life, max: life, size: 3 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, color }); }
  if (!fxOn) { fxOn = true; fxLast = 0; requestAnimationFrame(fxLoop); }
}
function fxLoop(t) {
  const dt = fxLast ? Math.min(0.033, (t - fxLast) / 1000) : 0.016; fxLast = t;
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts) {
    p.vy += 1300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
    fctx.save(); fctx.globalAlpha = Math.max(0, p.life / p.max); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.fillStyle = p.color; fctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); fctx.restore();
  }
  parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
  if (parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}
const centerOf = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2, r.width]; };
function popNum(text, x, y) {
  const d = document.createElement("div"); d.className = "popnum"; d.textContent = text; document.body.appendChild(d);
  anim(d, [{ transform: `translate(${x}px,${y}px) translate(-50%,-50%) scale(.6)`, opacity: 0 }, { transform: `translate(${x}px,${y - 24}px) translate(-50%,-50%) scale(1.15)`, opacity: 1, offset: 0.25 }, { transform: `translate(${x}px,${y - 70}px) translate(-50%,-50%) scale(1)`, opacity: 0 }], { duration: 950, easing: "ease-out" }).then(() => d.remove());
}
function bigText(text) {
  const r = $("board").getBoundingClientRect(), d = document.createElement("div"); d.className = "bigtext"; d.textContent = text; d.style.top = r.top + r.height * 0.42 + "px"; document.body.appendChild(d);

  }

// ===================== swiping words =====================
function tileAt(x, y) {

  if (c < 0 || c >= M || row < 0 || row >= M) return null;

}
const pattern = () => path.map((i) => Core.letterOf(G.grid[i])).join("");
function showPath() { const p = pattern(), w = p.length >= 3 ? Core.resolveWord(p) : null; say(p ? up(w || p) : "Harfleri kaydırıp kelime yaz", !p ? "msg" : w ? "ok" : "no"); markPath(); }
$("gridwrap").addEventListener("pointerdown", (e) => {
  if (busy || !G) return;
  if (G.hand.length >= 3) { say("Elin dolu. Önce bir blok yerleştir.", "msg"); bump($("hand")); return; }
  if (G.mode === "level" && G.moves <= 0) { say("Hamle kalmadı. Elindeki blokları yerleştir.", "msg"); return; }
  const i = tileAt(e.clientX, e.clientY); if (i === null) return;
  e.preventDefault(); swiping = true; path = [i]; lastPt = [e.clientX, e.clientY]; hintPath = []; markHint(); showPath();
  try { $("gridwrap").setPointerCapture(e.pointerId); } catch {}
});
// Browsers report fast swipes as a few far-apart points; walking the straight line between them in small steps
// catches every tile the finger crossed, so a quick swipe does not skip a letter and break the word.
let lastPt = null;
function visitTile(x, y) {
  const i = tileAt(x, y), last = path[path.length - 1];
  if (i === null || i === last) return false;
  if (path.length > 1 && i === path[path.length - 2]) { path.pop(); return true; }
  if (!path.includes(i) && Core.adjacent(last, i) && path.length < MAX_LEN) { path.push(i); return true; }
  return false;
}
function traceTo(x, y) {
  const [x0, y0] = lastPt || [x, y], step = Math.max(3, geo().size / 6), n = Math.max(1, Math.ceil(Math.hypot(x - x0, y - y0) / step));
  let changed = false;
  for (let s = 1; s <= n; s++) changed = visitTile(x0 + ((x - x0) * s) / n, y0 + ((y - y0) * s) / n) || changed;

}
addEventListener("pointermove", (e) => {

    for (const p of pts.length ? pts : [e]) changed = traceTo(p.clientX, p.clientY) || changed;
    if (changed) showPath();
  } else if (drag) moveDrag(e);
});
addEventListener("pointerup", (e) => { if (swiping) { if (traceTo(e.clientX, e.clientY)) showPath(); endSwipe(); } else if (drag) endDrag(); });
addEventListener("pointercancel", () => { if (swiping) endSwipe(); if (drag) dropBack(); }); // a browser that cancels mid-swipe still gets the word

function endSwipe() {
  swiping = false;
  const p = pattern(), w = p.length >= 3 ? Core.resolveWord(p) : null;
  if (!w) {
    say(p.length < 3 ? "Kelime en az 3 harf olmalı" : `${up(p)} listede yok`, "msg");
    path.forEach((i) => { const t0 = tiles[i].el.style.transform; anim(tiles[i].el, [{ transform: t0 }, { transform: t0 + " translateX(-5px)" }, { transform: t0 + " translateX(5px)" }, { transform: t0 }], { duration: 260 }); });
    path = []; markPath(); return;
  }
  const used = path.slice(); path = []; drawTrace();
  const piece = Core.makePiece(G.grid, used); piece.color = G.colorTurn++ % COLORS.length;
  const slotIdx = G.hand.length; G.hand.push(piece);
  const t = performance.now(); G.chain = t - G.lastWordAt < CHAIN_MS ? Math.min(5, G.chain + 1) : 1; G.lastWordAt = t;
  const pts = Core.wordPoints(w, piece, G.chain);
  if (G.mode === "level") { G.moves--; bump($("moves")); }
  used.forEach((i, k) => { const kd = Core.kindOf(G.grid[i]), [x, y] = centerOf(tiles[i].el); if (kd === "crystal") creditGoal("crystal", x, y, k * 60); if (kd === "bomb") creditGoal("bomb", x, y, k * 60); });
  if (w.length >= 5) { const [x, y] = centerOf($("wordline")); creditGoal("long", x, y); }
  const [wx, wy] = centerOf(tiles[used[used.length - 1]].el); popNum(`+${pts}`, wx, wy - 10);
  addScore(pts);
  const parts = [`${up(w)} +${pts}`]; if (G.chain > 1) parts.push(`Seri x${G.chain}`); if (piece.gold) parts.push("Altın");
  say(parts.join(" · "), "ok");

    const plain = G.grid.map((tt, i) => (Core.kindOf(tt) ? -1 : i)).filter((i) => i >= 0); if (!plain.length) return;
    const j = plain[Math.floor(Math.random() * plain.length)]; G.grid[j] = "?"; setTile(tiles[j].el, "?"); const [x, y] = centerOf(tiles[j].el); burst(x, y, "#FFB627", 14, 0.6); toast("Seri ödülü: bir harf Joker oldu");

// ===================== dragging and placing blocks =====================
function boardGeo() { const r = $("board").getBoundingClientRect(); return { r, pitch: (r.width - 10) / B }; }
function startDrag(e, k) {
  if (busy || !G || drag) return;
  e.preventDefault();
  const slot = e.currentTarget, p = G.hand[k], mr = slot.querySelector(".mini").getBoundingClientRect(), { pitch } = boardGeo();
  // a block caught mid pop-in can measure 0 wide; then grab it by the middle
  const fx_ = mr.width > 4 ? Math.min(1, Math.max(0, (e.clientX - mr.left) / mr.width)) : 0.5, fy = mr.height > 4 ? Math.min(1, Math.max(0, (e.clientY - mr.top) / mr.height)) : 0.5;
  const el = blockEl(p, pitch - 2, "drag"); document.body.appendChild(el); slot.classList.add("lifted");
  drag = { k, p, el, pitch, fx: fx_, fy, at: null, slot };
  anim(el, [{ transform: `scale(${Math.max(0.2, mr.width / (p.w * pitch))})` }, { transform: "scale(1)" }], { duration: 140, easing: "ease-out" });
  moveDrag(e);
}

  el.style.left = left + "px"; el.style.top = top + "px"; el.style.transformOrigin = `${fx_ * 100}% ${fy * 100}%`;
  const { r } = boardGeo(), r0 = Math.round((top - r.top - 5) / pitch), c0 = Math.round((left - r.left - 5) / pitch);
  drag.at = Core.canPlace(G.board, p, r0, c0) ? [r0, c0] : null;
  setGhost(drag.at ? p.cells.map(([a, b]) => (r0 + a) * B + c0 + b) : []);
}

  const { el, slot } = drag, [sx, sy] = centerOf(slot), r = el.getBoundingClientRect(); drag = null; setGhost([]);
  anim(el, [{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${sx - r.left - r.width / 2}px,${sy - r.top - r.height / 2}px) scale(.4)`, opacity: 0.3 }], { duration: 220, easing: "ease-in" }).then(() => { el.remove(); slot.classList.remove("lifted"); });
}
function endDrag() {

async function placeBlock(k, p, at) {
  busy = true;
  const res = Core.place(G.board, p, at[0], at[1], p.color), placed = p.cells.map(([r, c]) => (at[0] + r) * B + at[1] + c);
  G.hand.splice(k, 1); renderHand();

    else if (res.lines >= 2) shake(3 + res.lines * 2);
    if (res.lines >= 3) bigText("MÜTHİŞ!"); else if (G.combo >= 2) bigText(`KOMBO x${G.combo}`); else if (res.lines === 2) bigText("İKİ BİRDEN!");
    if (res.lines) {

// ===================== boosters =====================
function useBooster(k) {
  if (busy || !G || swiping || drag) return;
  if (k === "ipucu" && G.hand.length >= 3) { say("Elin dolu. Önce bir blok yerleştir.", "msg"); return; }
  if (k === "ipucu" && G.mode === "level" && G.moves <= 0) { say("Hamle kalmadı.", "msg"); return; }
  const apply = () => {
    if (k === "karistir") { G.grid = Core.shuffleGrid(G.grid, G.rnd); respinTiles(); }
    if (k === "yenile") { G.grid = Core.freshGrid(G.rnd, { rates: G.L.rates }); respinTiles(); }
    if (k === "joker") {
      const plain = G.grid.map((t, i) => (Core.kindOf(t) ? -1 : i)).filter((i) => i >= 0);
      if (plain.length) { const j = plain[Math.floor(Math.random() * plain.length)]; G.grid[j] = "?"; setTile(tiles[j].el, "?"); const [x, y] = centerOf(tiles[j].el); burst(x, y, "#9B5DE5", 18, 0.7); bump(tiles[j].el.firstChild); }
    }
    if (k === "ipucu") {
      const open = Object.fromEntries(Object.entries(G.left).filter(([, v]) => v > 0)), h = Core.bestMove(G.grid, G.board, open);
      hintPath = h ? h.path : []; markHint();
      if (h) { const pc = Core.makePiece(G.grid, h.path); setGhost(pc.cells.map(([a, b]) => (h.r + a) * B + h.c + b), "suggest"); }
      say(h ? "Parlayan harfleri sırayla takip et; yeşil çerçeve bloğun en iyi yeri" : "Şu an sığan kelime yok. Yenile'yi dene.", "msg");
    }
    afterTurn();
  };
  if (isAdmin()) return apply();
  if (inv()[k] > 0) { inv()[k]--; saveProfile(); renderBoosters(); apply(); } else fakeAd(() => { renderBoosters(); apply(); });
}

  busy = true;

    <button class="b3 xl" id="o-ad">▶ Reklam izle: ${canDiscard ? "bloklarını at" : "yeni harfler al"}</button>
    ${G.mode === "duel" ? `<button class="b3 blue" id="o-end">Bitir</button>` : s ? `<button class="b3 green" id="o-take">${s} yıldızla bitir</button>` : `<button class="b3 blue" id="o-retry">Yeniden başla</button>`}<button class="b3 ghost" id="o-map">${G.mode === "duel" ? "Ana ekran" : "Harita"}</button>`);
  $("o-ad").onclick = () => fakeAd(() => { if (canDiscard) { G.hand = []; renderHand(); } else { G.grid = Core.freshGrid(G.rnd, { rates: G.L.rates }); respinTiles(); } afterTurn(); });
  if ($("o-end")) $("o-end").onclick = finishDuel; if ($("o-take")) $("o-take").onclick = () => levelEnd(s, false); if ($("o-retry")) $("o-retry").onclick = () => startLevel(G.L.n);
  $("o-map").onclick = G.mode === "duel" ? landing : openMap;
}
const GIFTS_PER_STAR = { 1: ["karistir"], 2: ["ipucu"], 3: ["yenile", "joker"] };
function levelEnd(stars, finishedAll) {
  busy = true;
  const L = G.L, bonus = finishedAll ? G.moves * 20 : 0, prev = profile.stars[L.n] || 0;
  const gifts = []; for (let s = prev + 1; s <= stars; s++) gifts.push(...GIFTS_PER_STAR[s]); // only newly earned stars pay out
  if (L.joker && !prev) gifts.push(...["karistir", "yenile", "ipucu", "joker"].sort(() => Math.random() - 0.5).slice(0, 2)); // joker levels give two extra gifts the first time
  gifts.forEach((k) => inv()[k]++);
  const final = G.score + bonus;
  profile.stars[L.n] = Math.max(prev, stars); profile.best[L.n] = Math.max(profile.best[L.n] || 0, final); saveProfile(); renderBoosters();
  confetti();
  card(`<div class="lvlhead"><div class="stars">${[1, 2, 3].map((s, i) => star(s <= stars).replace("<svg", `<svg style="animation-delay:${0.2 + i * 0.25}s"`)).join("")}</div>
    <h2>Bölüm ${L.n + 1} ${stars === 3 ? "tamam!" : "geçildi"}</h2></div><div class="big" id="o-score">${G.score}</div>
    <p>${finishedAll ? (G.moves ? `Kalan ${G.moves} hamle × 20 = +${bonus}` : "Son hamlede bitirdin.") : `Hedeflerin bir kısmı kaldı. Tekrar oynayıp ${stars + 1}. yıldızı alabilirsin.`}</p>
    ${gifts.length ? `<h3>Hediyeler</h3><div class="gifts">${gifts.map((k, i) => `<div class="gift" style="animation-delay:${0.9 + i * 0.18}s">${icon(k)}<strong>+1</strong>${BOOSTERS[k].name}</div>`).join("")}</div>` : `<p>Bu yıldızların hediyelerini almıştın. Daha çok yıldız, daha çok hediye.</p>`}
    <button class="b3 xl green" id="o-next">Sonraki bölüm</button><div class="row2"><button class="b3 ghost" id="o-again">Tekrar</button><button class="b3 ghost" id="o-map">Harita</button></div>`, L.joker ? JOKER_THEME : BIOME_THEMES[worldOf(L.n)]);
  const sc = $("o-score"), t0 = performance.now(); // count the move bonus up
  (function count(t) { const f = Math.min(1, (t - t0) / 900); sc.textContent = Math.round(G.score + bonus * f); if (f < 1 && !RM) requestAnimationFrame(count); else sc.textContent = final; })(t0);
  $("o-next").onclick = () => intro(L.n + 1); $("o-again").onclick = () => startLevel(L.n); $("o-map").onclick = openMap;
}
function timeUp() {
  busy = true;
  if (G.extended) return finishDuel();
  const rv = G.rival.at(DUEL_SECONDS);
  card(`<h2>Süre bitti</h2><div class="vs"><div class="${G.score > rv ? "win" : ""}"><strong>${G.score}</strong><span>Sen</span></div><p>–</p><div class="${rv >= G.score ? "win" : ""}"><strong>${rv}</strong><span>${G.rival.name}</span></div></div>
    <p>${G.score > rv ? "Öndesin. Bitir ve kazan." : `Rakibi geçmek için ${rv - G.score + 1} puan lazım.`}</p>
    <button class="b3 xl" id="o-ad">▶ Reklam izle: +15 saniye</button><button class="b3 ghost" id="o-end">Sonucu gör</button>`);
  $("o-end").onclick = finishDuel;
  $("o-ad").onclick = () => fakeAd(() => { G.extended = true; G.timeLeft = 15; G.running = true; });
}
function finishDuel() {
  busy = true; G.running = false;
  const rv = G.rival.at(DUEL_SECONDS), win = G.score > rv;
  profile.duelBest = Math.max(profile.duelBest || 0, G.score); saveProfile();
  if (win) confetti();
  const day = NOW.toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
  const share = `Shapeword Düello · ${day}\n${G.score} – ${rv} ${G.rival.name}\n${win ? "🏆 Kazandım" : "Bu sefer kaybettim"}${G.extended ? " (+15 sn)" : ""}`;
  card(`<h2>${win ? "Kazandın!" : `${G.rival.name} kazandı`}</h2>
    <div class="vs"><div class="${win ? "win" : ""}"><strong>${G.score}</strong><span>Sen</span></div><p>–</p><div class="${win ? "" : "win"}"><strong>${rv}</strong><span>${G.rival.name}</span></div></div>
    <textarea class="share" id="o-share" rows="3" readonly aria-label="Paylaşım metni">${share}</textarea>
    <button class="b3 blue" id="o-copy">Sonucu kopyala</button><div class="row2"><button class="b3 ghost" id="o-again">Tekrar</button><button class="b3 ghost" id="o-home">Ana ekran</button></div>`);
  $("o-copy").onclick = () => navigator.clipboard.writeText(share).then(() => ($("o-copy").textContent = "Kopyalandı")).catch(() => { $("o-share").select(); $("o-copy").textContent = "Seçildi, kopyala"; });
  $("o-again").onclick = startDuel; $("o-home").onclick = landing;
}
$("back").onclick = () => (G && G.mode === "duel" ? landing() : openMap());

landing();
</script>
</body>
</html>
