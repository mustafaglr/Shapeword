<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Kelime yaz, çizdiğin yol blok olsun, tahtada patlat. Türkçe kelime ve blok bulmacası.">
<meta name="theme-color" content="#11142A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shapeword">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shapeword</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600&display=swap">
<style>
/* Layout: one phone column in play order: moves + goals -> themed letter field -> your blocks -> 9x9 board -> boosters.
   Letters, board cells and blocks are persistent elements that move; bursts, sparks and confetti run on one canvas above the page. */
:root {
  --bg: #ECEEF6; --surface: #FFFFFF; --ink: #1D2340; --muted: #646B8A; --line: #D6DAEA; --well: #DCE0EE;
  --accent: #4D7CFE; --good: #1A9E73; --bad: #E5484D; --gold: #F5B700; --gold-ink: #3A2A00; --rival: #E5484D;
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --text: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11142A; --surface: #232951; --ink: #ECEEF8; --muted: #A3AACB; --line: #343C6E; --well: #1B2046;
  --accent: #7D9DFF; --good: #3CCB98; --bad: #FF6B70; --gold: #FFC93C; --gold-ink: #3A2A00; --rival: #FF6B70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11142A; --surface: #232951; --ink: #ECEEF8; --muted: #A3AACB; --line: #343C6E; --well: #1B2046;
  --accent: #7D9DFF; --good: #3CCB98; --bad: #FF6B70; --gold: #FFC93C; --gold-ink: #3A2A00; --rival: #FF6B70; color-scheme: dark }

/* sized to fit one phone screen: the letter field and the board scale with the viewport height (dvh where supported) */
html, body { overscroll-behavior: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 6px 12px; }
main { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px; user-select: none; -webkit-user-select: none; }
.top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.back { border: 0; background: var(--surface); color: var(--ink); width: 36px; height: 36px; border-radius: 12px; font: 700 1.3rem var(--display); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.moves { min-width: 56px; text-align: center; background: var(--surface); border-radius: 14px; padding: 4px 8px; box-shadow: inset 0 0 0 1px var(--line); }
.moves strong { display: block; font: 700 1.45rem/1 var(--display); font-variant-numeric: tabular-nums; }
.moves small { font: 600 .6rem var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.moves.low strong { color: var(--bad); }

.goals { display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; min-height: 38px; align-items: center; min-width: 0; }
.goal { display: flex; align-items: center; gap: 4px; padding: 3px 9px 3px 5px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font: 700 1rem var(--display); font-variant-numeric: tabular-nums; }
.goal svg { width: 24px; height: 24px; }
.goal.done { background: var(--good); color: #fff; box-shadow: none; }
.duel { display: grid; gap: 4px; width: 100%; }
.duel .row { display: grid; grid-template-columns: 56px 1fr 46px; align-items: center; gap: 8px; font: 600 .8rem var(--text); }
.duel .row span:last-child { text-align: right; font: 700 .95rem var(--display); font-variant-numeric: tabular-nums; }
.bar { height: 9px; border-radius: 999px; background: var(--well); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width .3s; }
.bar.rival i { background: var(--rival); }

/* themed letter field; the word you trace shows at its top in white */
.field { position: relative; border-radius: 24px; padding: 8px 12px 12px; background: linear-gradient(160deg, var(--c1), var(--c2)); overflow: hidden; transition: background .6s; }
.field::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.16) 1.5px, transparent 1.6px); background-size: 16px 16px; pointer-events: none; animation: drift 30s linear infinite; }
@keyframes drift { to { background-position: 160px 80px; } }
.fieldhead { position: relative; display: flex; justify-content: space-between; gap: 8px; }
.tagline { font: 700 .66rem var(--text); letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.88); font-variant-numeric: tabular-nums; }
.wordline { position: relative; min-height: 28px; display: flex; align-items: center; justify-content: center; font: 700 1.2rem var(--display); letter-spacing: .1em; text-transform: uppercase; text-align: center; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.wordline.ok { color: #FFF4B8; text-shadow: 0 0 12px rgba(255,244,184,.8), 0 1px 2px rgba(0,0,0,.35); } .wordline.no { color: rgba(255,255,255,.6); }
.wordline.msg { font: 600 .85rem var(--text); letter-spacing: 0; text-transform: none; color: rgba(255,255,255,.9); }
.gridwrap { position: relative; width: min(72%, 25vh); width: min(72%, 25dvh); aspect-ratio: 1; margin: 2px auto 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.trace { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2; }
.tile { position: absolute; left: 0; top: 0; border-radius: 50%; display: grid; place-items: center; z-index: 1; will-change: transform;
  background: radial-gradient(circle at 35% 28%, #FFFFFF 0 16%, #EEF0FA 42%, #C6CCE4 100%); color: #1D2340;
  box-shadow: 0 3px 0 rgba(0,0,0,.25), inset 0 -3px 6px rgba(0,0,0,.12); font-family: var(--display); font-weight: 600; text-transform: uppercase; }
.tile span { transition: transform .12s; }
.tile.gold { background: radial-gradient(circle at 35% 28%, #FFF6D0 0 14%, #FFC93C 48%, #D99400 100%); color: #3A2A00; }
.tile.bomb { background: radial-gradient(circle at 35% 28%, #6B5A8C 0 12%, #2B2240 55%, #120D1E 100%); color: #fff; box-shadow: 0 0 0 2px #FF5A4F, 0 3px 0 rgba(0,0,0,.3); }
.tile.bomb::after { content: ""; position: absolute; top: 4%; right: 10%; width: 14%; height: 14%; border-radius: 50%; background: #FF5A4F; box-shadow: 0 0 8px #FF5A4F; animation: fuse .6s ease-in-out infinite alternate; }
@keyframes fuse { to { opacity: .35; } }
.tile.crystal { background: radial-gradient(circle at 35% 28%, #F3E8FF 0 14%, #B57BFF 50%, #6D28D9 100%); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.tile.crystal::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 10px 2px rgba(181,123,255,.8); animation: glow 1.4s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .3; } }
.tile.joker { background: conic-gradient(from 30deg, #F25F5C, #FFB627, #2EC4B6, #4D7CFE, #9B5DE5, #F25F5C); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.tile.sel { box-shadow: 0 0 0 3px #fff, 0 0 18px rgba(255,255,255,.95); }
.tile.sel span { transform: scale(1.18); }
.tile.hint { animation: hint .9s ease-in-out infinite; }
@keyframes hint { 50% { box-shadow: 0 0 0 4px #fff, 0 0 22px #fff; } }

.hand { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; touch-action: none; }
.slot { height: clamp(50px, 8vh, 72px); height: clamp(50px, 8dvh, 72px); border-radius: 16px; background: color-mix(in srgb, var(--well) 60%, transparent); display: grid; place-items: center; cursor: grab; touch-action: none; transition: opacity .15s; }
.slot.cant .mini { opacity: .35; filter: grayscale(.6); }
.slot.lifted .mini { opacity: .15; }
.mini, .drag { display: grid; gap: 2px; }
.mini i, .drag i { border-radius: 4px; display: block; position: relative; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25); }
.mini i.bomb::after, .drag i.bomb::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: #2B2240; box-shadow: 0 0 0 2px #FF5A4F; }
.drag { position: fixed; pointer-events: none; z-index: 20; filter: drop-shadow(0 8px 10px rgba(0,0,0,.28)); }

.board { display: grid; grid-template-columns: repeat(9, 1fr); width: min(100%, 37vh); width: min(100%, 37dvh); margin: 0 auto; background: var(--well); border-radius: 16px; padding: 4px; box-sizing: border-box; touch-action: none; }
.cell { aspect-ratio: 1; max-width: 100%; padding: 1.5px; box-sizing: border-box; }
.cell > b { display: block; width: 100%; height: 100%; border-radius: 5px; background: color-mix(in srgb, var(--surface) 28%, var(--well)); will-change: transform; }
.cell.bx > b { background: color-mix(in srgb, var(--surface) 55%, var(--well)); }
.cell.on > b { box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.25); }
.cell.stone > b { background: radial-gradient(circle at 35% 30%, #B9BCC8, #7E8292 60%, #5B5E6E); box-shadow: inset 0 -3px 0 rgba(0,0,0,.3); border-radius: 7px; }
.cell.ice > b { background: linear-gradient(135deg, #E8F7FF 0 30%, #9FD6F7 31% 60%, #CDEBFF 61%); box-shadow: inset 0 0 0 2px #6CB8E8; }
.cell.ice.cracked > b { background: linear-gradient(135deg, transparent 0 46%, #fff 47% 50%, transparent 51%), linear-gradient(45deg, transparent 0 58%, #fff 59% 62%, transparent 63%), linear-gradient(135deg, #DDF2FF, #A9DAF7); box-shadow: inset 0 0 0 2px #8CC7EC; opacity: .9; }
.cell.ghost > b { outline: 2px dashed var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 32%, var(--well)); }
.cell.suggest > b { box-shadow: inset 0 0 0 2px var(--good); }

.boosters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.booster { position: relative; background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 14px; padding: 6px 4px 5px; color: var(--ink);
  font: 600 .72rem var(--text); display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; }
.booster svg { width: 20px; height: 20px; }
.booster .n { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--accent); color: #fff; font: 700 .72rem/20px var(--text); padding: 0 5px; box-sizing: border-box; }
.booster .n.ad { background: var(--gold); color: var(--gold-ink); }
.booster:focus-visible, .btn:focus-visible, .pick:focus-visible, .lvl:focus-visible, .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* floating effects */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 35; }
.fly { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 36; will-change: transform; }
.fly svg { width: 100%; height: 100%; display: block; }
.popnum { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 37; font: 700 1.4rem var(--display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 12px rgba(0,0,0,.25); white-space: nowrap; }
.bigtext { position: fixed; left: 50%; pointer-events: none; z-index: 37; font: 700 2.6rem/1 var(--display); color: var(--gold); text-shadow: 0 3px 0 #B8801A, 0 0 22px rgba(255,201,60,.6); white-space: nowrap; }
.wave { position: fixed; left: 0; top: 0; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border: 6px solid #FFD27A; pointer-events: none; z-index: 36; }
.toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font: 600 .88rem var(--text); box-shadow: 0 6px 18px rgba(0,0,0,.25); }

.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(10, 12, 28, .74); display: grid; place-items: center; overflow-y: auto; animation: fadein .2s ease-out;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
@keyframes fadein { from { opacity: 0; } }
.card { background: var(--surface); color: var(--ink); border-radius: 24px; padding: 20px; max-width: 380px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; text-align: center; animation: cardin .35s cubic-bezier(.3,1.4,.6,1); }
@keyframes cardin { from { transform: scale(.85) translateY(20px); opacity: 0; } }
.card h2 { font: 700 1.7rem/1.1 var(--display); margin: 0; text-wrap: balance; }
.card h3 { font: 700 1rem var(--display); margin: 4px 0 0; text-align: left; }
.card p { margin: 0; color: var(--muted); }
.big { font: 700 2.8rem/1 var(--display); font-variant-numeric: tabular-nums; color: var(--accent); }
.stars { display: flex; gap: 6px; justify-content: center; } .stars svg { width: 44px; height: 44px; animation: starin .45s cubic-bezier(.3,1.6,.6,1) backwards; }
@keyframes starin { from { transform: scale(0) rotate(-40deg); } }
.goallist { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.goallist div { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 12px; border-radius: 16px; background: var(--well); min-width: 72px; font: 600 .78rem var(--text); color: var(--muted); }
.goallist svg { width: 36px; height: 36px; } .goallist strong { font: 700 1.3rem var(--display); color: var(--ink); }
.gifts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.gift { width: 74px; padding: 10px 4px 8px; border-radius: 14px; background: var(--well); display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 .74rem var(--text); animation: giftin .5s cubic-bezier(.3,1.5,.6,1) backwards; }
.gift svg { width: 26px; height: 26px; } .gift strong { font: 700 .95rem var(--display); color: var(--accent); }
@keyframes giftin { from { transform: scale(.3) rotate(-14deg); opacity: 0; } }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; }
.vs div { display: flex; flex-direction: column; } .vs strong { font: 700 2.1rem/1 var(--display); font-variant-numeric: tabular-nums; } .vs span { font-size: .78rem; color: var(--muted); }
.vs .win strong { color: var(--good); }
.btn { font: 600 1rem var(--display); border: 0; border-radius: 14px; padding: 12px 16px; cursor: pointer; background: var(--well); color: var(--ink); transition: transform .1s; }
.btn:active, .pick:active, .lvl:active, .booster:active { transform: scale(.96); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.pick { text-align: left; border: 0; border-radius: 16px; padding: 13px 16px; cursor: pointer; background: var(--well); color: var(--ink); display: flex; flex-direction: column; gap: 2px; font: 600 .85rem var(--text); transition: transform .1s; }
.pick strong { font: 700 1.2rem var(--display); } .pick span { color: var(--muted); font-weight: 500; }
.pick.primary { background: var(--accent); color: #fff; } .pick.primary span { color: rgba(255,255,255,.85); }
.map { display: grid; gap: 12px; text-align: left; max-height: 62vh; overflow-y: auto; }
.map h3 { margin: 0; display: flex; align-items: center; gap: 8px; } .map h3 i { width: 14px; height: 14px; border-radius: 50%; }
.lvls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lvl { border: 0; border-radius: 12px; height: 50px; background: var(--well); color: var(--ink); font: 700 1rem var(--display); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; transition: transform .1s; }
.lvl small { font: 600 .62rem var(--text); color: var(--gold); letter-spacing: 1px; }
.lvl:disabled { opacity: .35; cursor: default; }
.lvl.next { background: var(--accent); color: #fff; animation: nudge 1.2s ease-in-out infinite; } .lvl.next small { color: #fff; }
@keyframes nudge { 50% { transform: scale(1.06); } }
.legend { display: grid; gap: 7px; text-align: left; font-size: .84rem; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 10px; }
.legend .chip { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 600 1rem var(--display); }
.share { width: 100%; box-sizing: border-box; font: .85rem ui-monospace, Menlo, monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: none; }
@media (max-height: 700px) { /* short phone screens (browser bars showing): tighten spacing so nothing scrolls */
  body { padding-block: 4px 6px; } main { gap: 5px; } .field { padding: 6px 10px 8px; } .wordline { min-height: 24px; font-size: 1.05rem; } .booster { padding: 4px 4px 3px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<main id="app">
  <div class="top">
    <button class="back" id="back" aria-label="Ana menü">‹</button>
    <div class="goals" id="goals" aria-label="Hedefler"></div>
    <div class="moves" id="moves"><strong id="moves-n">0</strong><small id="moves-l">hamle</small></div>
  </div>
  <div class="field" id="field">
    <div class="fieldhead"><span class="tagline" id="tagline"></span><span class="tagline" id="t-sub"></span></div>
    <div class="wordline msg" id="wordline" aria-live="polite">Harfleri kaydırıp kelime yaz</div>
    <div class="gridwrap" id="gridwrap" aria-label="Harf alanı">
      <svg class="trace" id="trace" aria-hidden="true"></svg>
    </div>
  </div>
  <div class="hand" id="hand" aria-label="Blokların"></div>
  <div class="board" id="board" aria-label="Tahta"></div>
  <div class="boosters" id="boosters"></div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="overlay" id="ov" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="words-tr.js" charset="utf-8"></script>
<script src="core.js" charset="utf-8"></script>
<script>
document.documentElement.lang = "tr"; // Turkish casing: i -> İ, ı -> I
const { M, B, MAX_LEN } = Core;
const $ = (id) => document.getElementById(id);
const up = (w) => w.toLocaleUpperCase("tr");
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = (ms) => new Promise((r) => setTimeout(r, RM ? 0 : ms));
// resolves when the animation ends, or after its planned time if the page is hidden and the animation stalls
const anim = (el, kf, o) => { const opts = RM ? { ...o, duration: 1, delay: 0 } : o;
  return Promise.race([el.animate(kf, opts).finished.catch(() => {}), new Promise((r) => setTimeout(r, (opts.duration || 0) + (opts.delay || 0) + 150))]); };
const COLORS = ["#F25F5C", "#FFB627", "#2EC4B6", "#4D7CFE", "#9B5DE5"];
// one colour pair per biome, in Core.BIOMES order (Orman, Çöl, Okyanus, Volkan, Buzul, Gece, Bahar, Kanyon)
const BIOME_THEMES = [["#1F6B45", "#9BCB5F"], ["#B4560B", "#F5C76B"], ["#0B4F8A", "#5ED3E8"], ["#8A1A0B", "#F07A3C"], ["#3A6EA5", "#BFE3FF"], ["#1B1446", "#7B6CF0"], ["#A3164F", "#F9C2D9"], ["#7A3B12", "#E0A15E"]];
const GOALS = {
  stone: { name: "Taş kır", svg: '<svg viewBox="0 0 24 24"><path d="M5 15l3-8 7-2 5 6-2 8-9 1z" fill="#8C8F9E" stroke="#5B5E6E" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 9l3 2 4-2" stroke="#B9BCC8" stroke-width="1.2" fill="none"/></svg>', color: "#8C8F9E" },
  ice: { name: "Buz darbesi", svg: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" fill="#BFE6FF" stroke="#6CB8E8" stroke-width="1.6"/><path d="M8 8l3 3M14 7l2 2M9 15l2-1" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>', color: "#9FD6F7" },
  crystal: { name: "Kristal", svg: '<svg viewBox="0 0 24 24"><path d="M12 2l7 7-7 13L5 9z" fill="#B57BFF" stroke="#6D28D9" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 9h14M12 2v20" stroke="#EADBFF" stroke-width="1"/></svg>', color: "#B57BFF" },
  long: { name: "5+ harf", svg: '<svg viewBox="0 0 24 24"><rect x="1.5" y="6" width="21" height="12" rx="4" fill="#4D7CFE"/><text x="12" y="15.3" font-size="8" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">5+</text></svg>', color: "#4D7CFE" },
  bomb: { name: "Bomba", svg: '<svg viewBox="0 0 24 24"><circle cx="11" cy="14" r="7" fill="#2B2240"/><path d="M15 9l3-3" stroke="#2B2240" stroke-width="2.2"/><circle cx="19" cy="5" r="2.2" fill="#FF5A4F"/><circle cx="9" cy="12" r="1.6" fill="#6B5A8C"/></svg>', color: "#FF5A4F" },
};
const BOOSTERS = {
  karistir: { name: "Karıştır", icon: '<path d="M4 7h3l10 10h3M4 17h3l3-3M14 10l3-3h3M18 4l3 3-3 3M18 14l3 3-3 3"/>' },

const fx = $("fx"), fctx = fx.getContext("2d"); let parts = [], fxOn = false, fxLast = 0;

addEventListener("resize", () => { fxResize(); layoutTiles(); }); fxResize();
function burst(x, y, color, n, power = 1) {
  if (RM) return;
  for (let k = 0; k < n; k++) { const life = 0.55 + Math.random() * 0.45; parts.push({ x, y, vx: (Math.random() - 0.5) * 460 * power, vy: (-Math.random() * 420 - 60) * power, life, max: life, size: 3 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, color }); }

}

  for (const p of parts) {
    p.vy += 1300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
    fctx.save(); fctx.globalAlpha = Math.max(0, p.life / p.max); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.fillStyle = p.color; fctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); fctx.restore();

}
const centerOf = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2, r.width]; };

}

}

let toastTimer;

// ===================== starting =====================
function baseState(L, rnd, mode) {
  return { mode, L, rnd, grid: Core.freshGrid(rnd, { rates: L.rates }), board: L.board.slice(), hand: [], score: 0, moves: L.moves,
    left: Object.fromEntries(L.goals.map((g) => [g.type, g.need])), shown: Object.fromEntries(L.goals.map((g) => [g.type, g.need])),
    combo: 0, chain: 0, lastWordAt: -1e9, colorTurn: 0, running: false, timeLeft: DUEL_SECONDS, extended: false, rival: null, extraMoves: 0 };
}
function startLevel(n) { G = baseState(Core.levelDef(n), Math.random, "level"); openScreen(); }
function startDuel() {
  const r = Core.rngFrom(TODAY + ":duel");
  G = baseState({ n: -1, biome: "Düello", goals: [], board: Core.emptyBoard(), moves: Infinity, plantRate: 0.5, rates: Core.BASE_RATES }, r, "duel");
  G.rival = makeRival(); G.running = true; openScreen();
}
function openScreen() {
  path = []; hintPath = [];
  const theme = G.mode === "duel" ? ["#3A2A7A", "#F28C6B"] : BIOME_THEMES[Math.floor(G.L.n / 10) % 8];
  $("field").style.setProperty("--c1", theme[0]); $("field").style.setProperty("--c2", theme[1]);
  $("tagline").textContent = G.mode === "duel" ? "Günlük Düello" : `${G.L.biome} · Bölüm ${G.L.n + 1}`;
  $("ov").hidden = true; busy = false;
  say(G.mode === "duel" ? "Süre başladı. Ne kadar çok puan, o kadar iyi." : "Harfleri kaydırıp kelime yaz", "msg");
  buildTiles(true); buildBoard(); renderHand(); renderGoals(); renderBoosters(); renderTop();
}
function makeRival() { // shortcut: a seeded curve, not a person; replace with recorded runs of real players on the same seed
  const r = Core.rngFrom(TODAY + ":rakip"), name = NAMES[Math.floor(r() * NAMES.length)], target = 700 + Math.floor(r() * 600);
  const cum = [0]; for (let i = 0; i < 40; i++) cum.push(cum[i] + 0.3 + r() * 1.4 * (i > 30 ? 1.4 : 1));
  return { name, target, at: (t) => { const x = Math.min(40, (t / DUEL_SECONDS) * 40), i = Math.floor(x), f = x - i; const v = i >= 40 ? cum[40] : cum[i] + (cum[i + 1] - cum[i]) * f; return Math.round((v / cum[40]) * target); } };
}
let lastTick = performance.now();
setInterval(() => {
  const t = performance.now(), dt = (t - lastTick) / 1000; lastTick = t;
  if (!G || !G.running || busy) return;
  G.timeLeft = Math.max(0, G.timeLeft - dt); renderTop(); renderGoals();
  if (G.timeLeft <= 0) { G.running = false; timeUp(); }
}, 100);

// ===================== letter field =====================
function geo() { const w = $("gridwrap").clientWidth, gap = Math.max(6, w * 0.03), size = (w - gap * (M - 1)) / M; return { w, gap, size, pitch: size + gap }; }
const pos = (i, g) => [(i % M) * g.pitch, ((i / M) | 0) * g.pitch];
function setTile(el, t) { el.className = "tile " + Core.kindOf(t); el.firstChild.textContent = Core.letterOf(t); }
function newTile(t, g) {
  const el = document.createElement("div"); el.appendChild(document.createElement("span")); setTile(el, t);
  el.style.width = el.style.height = g.size + "px"; el.style.fontSize = g.size * 0.46 + "px"; $("gridwrap").appendChild(el); return { el };
}
function placeTile(tl, i, g) { const [x, y] = pos(i, g); tl.el.style.transform = `translate(${x}px,${y}px)`; return [x, y]; }
function layoutTiles() { if (!tiles.length) return; const g = geo(); tiles.forEach((tl, i) => { if (!tl) return; tl.el.style.width = tl.el.style.height = g.size + "px"; tl.el.style.fontSize = g.size * 0.46 + "px"; placeTile(tl, i, g); }); }
function buildTiles(rain) { // a fresh grid rains in from above, row by row
  tiles.forEach((tl) => tl && tl.el.remove());
  const g = geo();
  tiles = G.grid.map((t, i) => {
    const tl = newTile(t, g), [x, y] = placeTile(tl, i, g);
    if (rain) anim(tl.el, [{ transform: `translate(${x}px,${y - g.w - 40}px)` }, { transform: `translate(${x}px,${y}px)` }], { duration: 520, delay: (M - 1 - ((i / M) | 0)) * 70 + (i % M) * 30, easing: "cubic-bezier(.3,1.3,.6,1)", fill: "backwards" });
    return tl;
  });
}
function respinTiles() { // after Karıştır / Yenile: every tile spins out and the new letter spins in
  const g = geo();
  tiles.forEach((tl, i) => { setTimeout(() => setTile(tl.el, G.grid[i]), RM ? 0 : 160 + i * 12); const [x, y] = pos(i, g);
    anim(tl.el, [{ transform: `translate(${x}px,${y}px) scale(1) rotate(0)` }, { transform: `translate(${x}px,${y}px) scale(.2) rotate(180deg)`, offset: 0.45 }, { transform: `translate(${x}px,${y}px) scale(1) rotate(360deg)` }], { duration: 420, delay: i * 12, easing: "ease-in-out" }); });
}
// used tiles fly into the hand slot where their block appears, the rest fall, new letters rain in
function animateWord(usedPath, res, slotIdx) {
  const g = geo(), slot = $("hand").children[slotIdx], [sx, sy] = centerOf(slot);
  usedPath.forEach((i, k) => {
    const tl = tiles[i], r = tl.el.getBoundingClientRect(), clone = tl.el.cloneNode(true);
    tl.el.remove();
    Object.assign(clone.style, { position: "fixed", left: "0", top: "0", zIndex: 36, transform: `translate(${r.left}px,${r.top}px)` }); clone.classList.remove("sel", "hint");
    document.body.appendChild(clone);
    const tx = sx - r.width / 2, ty = sy - r.height / 2;
    anim(clone, [{ transform: `translate(${r.left}px,${r.top}px) scale(1)` }, { transform: `translate(${(r.left + tx) / 2}px,${Math.min(r.top, ty) - 30}px) scale(.85)`, offset: 0.4 }, { transform: `translate(${tx}px,${ty}px) scale(.2)`, opacity: 0.2 }],
      { duration: 460, delay: k * 50, easing: "cubic-bezier(.5,0,.7,1)", fill: "forwards" }).then(() => clone.remove());
  });
  const next = new Array(M * M).fill(null);
  for (const { from, to } of res.moves) {
    const tl = tiles[from]; next[to] = tl; setTile(tl.el, res.grid[to]);
    const [x0, y0] = pos(from, g), [x1, y1] = placeTile(tl, to, g);
    if (from !== to) anim(tl.el, [{ transform: `translate(${x0}px,${y0}px)` }, { transform: `translate(${x1}px,${y1}px)` }], { duration: 240 + ((y1 - y0) / g.pitch) * 70, delay: 160, easing: "cubic-bezier(.35,1.45,.6,1)", fill: "backwards" });
  }
  const perCol = {}; res.fresh.forEach((f) => (perCol[f % M] = (perCol[f % M] || 0) + 1));
  for (const f of res.fresh) {
    const tl = newTile(res.grid[f], g), [x, y] = placeTile(tl, f, g); next[f] = tl;
    anim(tl.el, [{ transform: `translate(${x}px,${y - perCol[f % M] * g.pitch - 30}px)`, opacity: 0 }, { transform: `translate(${x}px,${y}px)`, opacity: 1 }],
      { duration: 420, delay: 240 + (M - 1 - ((f / M) | 0)) * 60 + (f % M) * 20, easing: "cubic-bezier(.3,1.35,.6,1)", fill: "backwards" });
  }
  tiles = next;
}
function drawTrace() {
  const svg = $("trace");
  if (path.length < 2) { svg.innerHTML = ""; return; }
  const g = geo(), pts = path.map((i) => { const [x, y] = pos(i, g); return `${x + g.size / 2},${y + g.size / 2}`; }).join(" ");
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="${g.size * 0.42}" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="#fff" stroke-width="${g.size * 0.14}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function markPath() { tiles.forEach((tl, i) => tl && tl.el.classList.toggle("sel", path.includes(i))); drawTrace(); }
function markHint() { tiles.forEach((tl, i) => tl && tl.el.classList.toggle("hint", hintPath.includes(i))); }

// ===================== board =====================
function buildBoard() {
  const bd = $("board"); bd.innerHTML = ""; cellEls = [];
  for (let i = 0; i < B * B; i++) {
    const r = (i / B) | 0, c = i % B, d = document.createElement("div"), b = document.createElement("b");
    d.className = "cell"; d.dataset.bx = (Math.floor(r / 3) + Math.floor(c / 3)) % 2; d.appendChild(b); bd.appendChild(d); cellEls.push(d); paintCell(i);
  }
}
function paintCell(i, v = G.board[i]) {
  const d = cellEls[i], b = d.firstChild;
  d.className = "cell" + (d.dataset.bx === "1" ? " bx" : "") + (v ? (v.ob ? ` ${v.ob}${v.hp === 1 && v.ob === "ice" ? " cracked" : ""}` : " on") : "");
  b.style.background = v && !v.ob ? COLORS[v.color] : "";
}
function setGhost(list, cls = "ghost") { ghostCells.forEach((i) => cellEls[i].classList.remove("ghost", "suggest")); ghostCells = list; list.forEach((i) => cellEls[i].classList.add(cls)); }
const cellColor = (v) => (!v ? "#fff" : v.ob === "stone" ? "#8C8F9E" : v.ob === "ice" ? "#BFE6FF" : COLORS[v.color]);

// ===================== hand, goals, top bar =====================
function blockEl(p, size, cls) {
  const m = document.createElement("div"); m.className = cls;
  m.style.gridTemplateColumns = `repeat(${p.w}, ${size}px)`; m.style.gridTemplateRows = `repeat(${p.h}, ${size}px)`;
  p.cells.forEach(([r, c], k) => { const i = document.createElement("i"); i.style.gridArea = `${r + 1} / ${c + 1}`; i.style.background = COLORS[p.color]; if (k === p.bombIdx) i.className = "bomb"; m.appendChild(i); });
  return m;
}
function renderHand(popIdx = -1) {
  const h = $("hand"); h.innerHTML = "";
  for (let k = 0; k < 3; k++) {
    const s = document.createElement("div"), p = G.hand[k]; s.className = "slot";
    if (p) {
      if (!Core.fits(G.board, p)) s.classList.add("cant");
      const room = Math.min(62, (h.clientHeight || 64) - 10), m = blockEl(p, Math.min(16, Math.floor((room - 2 * (Math.max(p.w, p.h) - 1)) / Math.max(p.w, p.h))), "mini"); s.appendChild(m);
      s.addEventListener("pointerdown", (e) => startDrag(e, k));
      s.setAttribute("aria-label", `${p.cells.length} karelik blok${p.bombIdx >= 0 ? ", bombalı" : ""}`);
      if (k === popIdx) anim(m, [{ transform: "scale(0) rotate(-20deg)" }, { transform: "scale(1.2) rotate(4deg)", offset: 0.6 }, { transform: "scale(1) rotate(0)" }], { duration: 380, easing: "ease-out" });
    }
    h.appendChild(s);
  }
}
function renderGoals() {
  const box = $("goals");
  if (G.mode === "duel") {
    const el = Math.min(DUEL_SECONDS, DUEL_SECONDS - G.timeLeft), rv = G.rival.at(el), top = Math.max(G.score, rv, G.rival.target, 1);
    if (!box.querySelector(".duel")) box.innerHTML = `<div class="duel"><div class="row"><span>Sen</span><div class="bar"><i id="bar-me"></i></div><span id="sc-me"></span></div><div class="row"><span>${G.rival.name}</span><div class="bar rival"><i id="bar-rv"></i></div><span id="sc-rv"></span></div></div>`;
    $("sc-me").textContent = G.score; $("sc-rv").textContent = rv; $("bar-me").style.width = (G.score / top) * 100 + "%"; $("bar-rv").style.width = (rv / top) * 100 + "%";
    return;
  }
  box.innerHTML = G.L.goals.map((g) => `<div class="goal${G.shown[g.type] ? "" : " done"}" data-g="${g.type}" aria-label="${GOALS[g.type].name}: ${G.shown[g.type]} kaldı">${GOALS[g.type].svg}<span>${G.shown[g.type] || "✓"}</span></div>`).join("");
}
function renderTop() {
  if (G.mode === "duel") { const s = Math.ceil(G.timeLeft); $("moves-n").textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`; $("moves-l").textContent = "süre"; $("moves").classList.toggle("low", G.timeLeft <= 15); }
  else { $("moves-n").textContent = G.moves; $("moves-l").textContent = "hamle"; $("moves").classList.toggle("low", G.moves <= 3); }
  $("t-sub").textContent = `${G.score} puan`;
}
function renderBoosters() {
  $("boosters").innerHTML = Object.keys(BOOSTERS).map((k) => `<button class="booster" data-b="${k}" aria-label="${BOOSTERS[k].name}, ${inv[k] ? inv[k] + " adet" : "reklam izleyerek"}">${icon(k)}${BOOSTERS[k].name}<span class="n${inv[k] ? "" : " ad"}">${inv[k] || "▶"}</span></button>`).join("");
  $("boosters").querySelectorAll(".booster").forEach((b) => (b.onclick = () => useBooster(b.dataset.b)));
}
function say(text, cls) { const w = $("wordline"); w.className = "wordline " + cls; w.textContent = text; }
// a goal unit flies from (x,y) to its chip; the chip counts down when it lands
function creditGoal(type, x, y, delay = 0) {
  if (!G.left || !(type in G.left) || G.left[type] <= 0) return;
  G.left[type]--;
  const chip = $("goals").querySelector(`[data-g="${type}"]`); if (!chip) return;
  flyTo(GOALS[type].svg, x, y, chip, 30, delay).then(() => { G.shown[type] = Math.max(0, G.shown[type] - 1); renderGoals(); const c = $("goals").querySelector(`[data-g="${type}"]`); if (c) bump(c); });
}

// ===================== swiping words =====================
function tileAt(x, y) {
  const r = $("gridwrap").getBoundingClientRect(), g = geo();
  const c = Math.floor((x - r.left) / g.pitch), row = Math.floor((y - r.top) / g.pitch);
  if (c < 0 || c >= M || row < 0 || row >= M) return null;
  return Math.hypot(x - (r.left + c * g.pitch + g.size / 2), y - (r.top + row * g.pitch + g.size / 2)) < g.size * 0.48 ? row * M + c : null; // round hit zone so diagonal swipes slip between neighbours
}
const pattern = () => path.map((i) => Core.letterOf(G.grid[i])).join("");
function showPath() {
  const p = pattern(), w = p.length >= 3 ? Core.resolveWord(p) : null;
  say(p ? up(w || p) : "Harfleri kaydırıp kelime yaz", !p ? "msg" : w ? "ok" : "no"); markPath();
}
$("gridwrap").addEventListener("pointerdown", (e) => {
  if (busy || !G) return;
  if (G.hand.length >= 3) { say("Elin dolu. Önce bir blok yerleştir.", "msg"); bump($("hand")); return; }
  if (G.mode === "level" && G.moves <= 0) { say("Hamle kalmadı. Elindeki blokları yerleştir.", "msg"); return; }
  const i = tileAt(e.clientX, e.clientY); if (i === null) return;
  e.preventDefault(); swiping = true; path = [i]; hintPath = []; markHint(); showPath();
});
addEventListener("pointermove", (e) => {
  if (swiping) {
    const i = tileAt(e.clientX, e.clientY), last = path[path.length - 1];
    if (i === null || i === last) return;
    if (path.length > 1 && i === path[path.length - 2]) path.pop();
    else if (!path.includes(i) && Core.adjacent(last, i) && path.length < MAX_LEN) path.push(i);
    else return;
    showPath();
  } else if (drag) moveDrag(e);
});
addEventListener("pointerup", () => { if (swiping) endSwipe(); else if (drag) endDrag(); });
addEventListener("pointercancel", () => { if (swiping) { swiping = false; path = []; markPath(); } if (drag) dropBack(); });

function endSwipe() {
  swiping = false;
  const p = pattern(), w = p.length >= 3 ? Core.resolveWord(p) : null;
  if (!w) {
    say(p.length < 3 ? "Kelime en az 3 harf olmalı" : `${up(p)} listede yok`, "msg");
    path.forEach((i) => anim(tiles[i].el, [{ transform: tiles[i].el.style.transform + " translateX(0)" }, { transform: tiles[i].el.style.transform + " translateX(-5px)" }, { transform: tiles[i].el.style.transform + " translateX(5px)" }, { transform: tiles[i].el.style.transform }], { duration: 260 }));
    path = []; markPath(); return;
  }
  const used = path.slice(); path = []; drawTrace();
  const piece = Core.makePiece(G.grid, used); piece.color = G.colorTurn++ % COLORS.length;
  const slotIdx = G.hand.length; G.hand.push(piece);
  const t = performance.now(); G.chain = t - G.lastWordAt < CHAIN_MS ? Math.min(5, G.chain + 1) : 1; G.lastWordAt = t;
  const pts = w.length * 3 * 2 ** piece.gold * G.chain + (w.length >= 5 ? 15 : 0); G.score += pts;
  if (G.mode === "level") { G.moves--; bump($("moves")); }
  // goal units earned by the word itself fly from their letters
  used.forEach((i, k) => { const kd = Core.kindOf(G.grid[i]), [x, y] = centerOf(tiles[i].el); if (kd === "crystal") creditGoal("crystal", x, y, k * 60); if (kd === "bomb") creditGoal("bomb", x, y, k * 60); });
  if (w.length >= 5) { const [x, y] = centerOf($("wordline")); creditGoal("long", x, y); }
  const [wx, wy] = centerOf(tiles[used[used.length - 1]].el); popNum(`+${pts}`, wx, wy - 10);
  const parts = [`${up(w)} +${pts}`]; if (G.chain > 1) parts.push(`Seri x${G.chain}`); if (piece.gold) parts.push("Altın");
  say(parts.join(" · "), "ok");
  const res = Core.collapse(G.grid, used, G.rnd, { rates: G.L.rates, plantRate: G.L.plantRate });
  animateWord(used, res, slotIdx); G.grid = res.grid;
  if (G.chain === 4) setTimeout(() => { // fast streak reward: one tile becomes a joker
    const plain = G.grid.map((tt, i) => (Core.kindOf(tt) ? -1 : i)).filter((i) => i >= 0); if (!plain.length) return;
    const j = plain[Math.floor(Math.random() * plain.length)]; G.grid[j] = "?"; setTile(tiles[j].el, "?"); const [x, y] = centerOf(tiles[j].el); burst(x, y, "#FFB627", 14, 0.6); toast("Seri ödülü: bir harf Joker oldu");
  }, 700);
  setTimeout(() => renderHand(slotIdx), RM ? 0 : 420);
  renderTop(); setTimeout(afterTurn, RM ? 0 : 700);
}

// ===================== dragging and placing blocks =====================
function boardGeo() { const r = $("board").getBoundingClientRect(); return { r, pitch: (r.width - 8) / B }; }
function startDrag(e, k) {
  if (busy || !G || drag) return;
  e.preventDefault();
  const slot = e.currentTarget, p = G.hand[k], mr = slot.querySelector(".mini").getBoundingClientRect(), { pitch } = boardGeo();
  // a block caught mid pop-in can measure 0 wide; then grab it by the middle
  const fx_ = mr.width > 4 ? Math.min(1, Math.max(0, (e.clientX - mr.left) / mr.width)) : 0.5, fy = mr.height > 4 ? Math.min(1, Math.max(0, (e.clientY - mr.top) / mr.height)) : 0.5;
  const el = blockEl(p, pitch - 2, "drag"); document.body.appendChild(el); slot.classList.add("lifted");
  drag = { k, p, el, pitch, fx: fx_, fy, at: null, slot };
  anim(el, [{ transform: `scale(${Math.max(0.2, mr.width / (p.w * pitch))})` }, { transform: "scale(1)" }], { duration: 140, easing: "ease-out" });
  moveDrag(e);
}
function moveDrag(e) {
  const { p, el, pitch, fx: fx_, fy } = drag, w = p.w * pitch, h = p.h * pitch;
  const left = e.clientX - fx_ * w, top = e.clientY - fy * h; // the point you grabbed stays under your finger
  el.style.left = left + "px"; el.style.top = top + "px"; el.style.transformOrigin = `${fx_ * 100}% ${fy * 100}%`;
  const { r } = boardGeo(), r0 = Math.round((top - r.top - 4) / pitch), c0 = Math.round((left - r.left - 4) / pitch);
  drag.at = Core.canPlace(G.board, p, r0, c0) ? [r0, c0] : null;
  setGhost(drag.at ? p.cells.map(([a, b]) => (r0 + a) * B + c0 + b) : []);
}
function dropBack() { // an invalid drop slides back to its slot
  const { el, slot } = drag, [sx, sy] = centerOf(slot), r = el.getBoundingClientRect(); drag = null; setGhost([]);
  anim(el, [{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${sx - r.left - r.width / 2}px,${sy - r.top - r.height / 2}px) scale(.4)`, opacity: 0.3 }], { duration: 220, easing: "ease-in" }).then(() => { el.remove(); slot.classList.remove("lifted"); });
}
function endDrag() {
  if (!drag.at) return dropBack();
  const { k, p, at, el } = drag; drag = null; el.remove(); setGhost([]);
  placeBlock(k, p, at);
}
async function placeBlock(k, p, at) {
  busy = true;
  const res = Core.place(G.board, p, at[0], at[1], p.color), placed = p.cells.map(([r, c]) => (at[0] + r) * B + at[1] + c);
  G.hand.splice(k, 1); renderHand();
  placed.forEach((i, j) => { paintCell(i, { color: p.color }); anim(cellEls[i].firstChild, [{ transform: "scale(.3)" }, { transform: "scale(1.15)", offset: 0.6 }, { transform: "scale(1)" }], { duration: 260, delay: j * 30, easing: "ease-out" }); });
  G.score += p.cells.length;
  const hits = [...res.cleared, ...res.cracked];
  if (hits.length) {
    await wait(220);
    const cr = placed.reduce((a, i) => a + ((i / B) | 0), 0) / placed.length, cc = placed.reduce((a, i) => a + (i % B), 0) / placed.length;
    if (res.lines) G.combo++; else if (!res.bombed.length) G.combo = 0;
    const pts = (res.lines ? 20 * res.lines * res.lines * Math.max(1, G.combo) : 0) + res.bombed.length * 5 + res.broken.length * 10;
    G.score += pts;
    let maxD = 0;
    for (const i of hits) {
      const d = Math.hypot(((i / B) | 0) - cr, (i % B) - cc); maxD = Math.max(maxD, d);
      setTimeout(() => explodeCell(i, res), RM ? 0 : d * 34); // the clear spreads out from where the block landed
    }
    try { navigator.vibrate?.(res.bombed.length ? 45 : res.lines >= 2 ? 25 : 12); } catch {} // a small buzz on Android; iOS ignores it
    const [bx, by] = centerOf(cellEls[placed[Math.floor(placed.length / 2)]]);
    popNum(`+${pts}`, bx, by - 20);
    if (res.bombed.length) { const bi = (at[0] + p.cells[p.bombIdx][0]) * B + at[1] + p.cells[p.bombIdx][1], [x, y] = centerOf(cellEls[bi]); shockwave(x, y); shake(10); burst(x, y, "#FFD27A", 30, 1.2); }
    else if (res.lines >= 2) shake(3 + res.lines * 2);
    if (res.lines >= 3) bigText("MÜTHİŞ!"); else if (G.combo >= 2) bigText(`KOMBO x${G.combo}`); else if (res.lines === 2) bigText("İKİ BİRDEN!");
    if (res.lines) {
      if (G.combo === 3) gift("karistir", "Kombo x3"); if (G.combo === 5) gift("ipucu", "Kombo x5"); if (G.combo === 7) gift("joker", "Kombo x7");
      if (res.lines >= 3) gift("yenile", `${res.lines} bölge birden`);
    }
    await wait(maxD * 34 + 360);
  } else G.combo = 0;
  G.board = res.board; G.board.forEach((_, i) => paintCell(i));
  renderHand(); renderTop(); if (G.mode === "duel") renderGoals();
  busy = false; afterTurn();
}
function explodeCell(i, res) {
  const [x, y] = centerOf(cellEls[i]), color = cellEls[i].classList.contains("stone") ? "#8C8F9E" : cellEls[i].classList.contains("ice") ? "#BFE6FF" : cellEls[i].firstChild.style.background || "#fff";
  if (res.cracked.includes(i)) { // ice takes a hit: shake and crack
    paintCell(i, res.board[i]); burst(x, y, "#E8F7FF", 8, 0.5); creditGoal("ice", x, y);
    anim(cellEls[i].firstChild, [{ transform: "rotate(0)" }, { transform: "rotate(-8deg) scale(1.1)" }, { transform: "rotate(6deg)" }, { transform: "rotate(0)" }], { duration: 260 });
    return;
  }
  const broken = res.broken.find((b) => b.i === i);
  burst(x, y, color, broken ? 14 : 8, broken ? 0.8 : 0.6);
  anim(cellEls[i].firstChild, [{ transform: "scale(1)", filter: "brightness(1)" }, { transform: "scale(1.3)", filter: "brightness(2.2)", offset: 0.35 }, { transform: "scale(0)", filter: "brightness(1)" }], { duration: 300, easing: "ease-in" })
    .then(() => { paintCell(i, null); anim(cellEls[i].firstChild, [{ opacity: 0 }, { opacity: 1 }], { duration: 160 }); });
  if (broken) creditGoal(broken.ob, x, y);
}
function gift(k, why) { inv[k]++; saveAll(); renderBoosters(); toast(`${why} ödülü: +1 ${BOOSTERS[k].name}`); bump($("boosters").querySelector(`[data-b="${k}"]`)); }

// ===================== boosters =====================
function useBooster(k) {
  if (busy || !G || swiping || drag) return;
  if (k === "ipucu" && G.hand.length >= 3) { say("Elin dolu. Önce bir blok yerleştir.", "msg"); return; }
  if (k === "ipucu" && G.mode === "level" && G.moves <= 0) { say("Hamle kalmadı.", "msg"); return; }
  const apply = () => {
    if (k === "karistir") { G.grid = Core.shuffleGrid(G.grid, G.rnd); respinTiles(); }
    if (k === "yenile") { G.grid = Core.freshGrid(G.rnd, { rates: G.L.rates }); respinTiles(); }
    if (k === "joker") {
      const plain = G.grid.map((t, i) => (Core.kindOf(t) ? -1 : i)).filter((i) => i >= 0);
      if (plain.length) { const j = plain[Math.floor(Math.random() * plain.length)]; G.grid[j] = "?"; setTile(tiles[j].el, "?"); const [x, y] = centerOf(tiles[j].el); burst(x, y, "#9B5DE5", 18, 0.7); bump(tiles[j].el.firstChild); }
    }
    if (k === "ipucu") {
      const open = Object.fromEntries(Object.entries(G.left).filter(([, v]) => v > 0)), h = Core.bestMove(G.grid, G.board, open);
      hintPath = h ? h.path : []; markHint();
      if (h) { const pc = Core.makePiece(G.grid, h.path); setGhost(pc.cells.map(([a, b]) => (h.r + a) * B + h.c + b), "suggest"); }
      say(h ? "Parlayan harfleri sırayla takip et; yeşil çerçeve bloğun en iyi yeri" : "Şu an sığan kelime yok. Yenile'yi dene.", "msg");
    }
    afterTurn();
  };
  if (inv[k] > 0) { inv[k]--; saveAll(); renderBoosters(); apply(); } else fakeAd(() => { renderBoosters(); apply(); });
}
function fakeAd(reward) {
  busy = true;
  card(`<p>Reklam simülasyonu</p><div class="big">▶</div><p>Gerçek oyunda burada ödüllü video oynar.</p>`);
  setTimeout(() => { $("ov").hidden = true; busy = false; lastTick = performance.now(); reward(); }, AD_MS);
}

// ===================== turn end, win, fail =====================
const goalsDone = () => G.mode === "level" && Object.values(G.left).every((v) => v <= 0);
function anyWordFits() { for (const [, p] of Core.findWords(G.grid)) if (Core.fits(G.board, Core.makePiece(G.grid, p))) return true; return false; }
function afterTurn() {
  if (!G || busy) return;
  if (goalsDone()) { busy = true; return setTimeout(levelWon, RM ? 0 : 900); }
  const handFits = G.hand.some((p) => Core.fits(G.board, p));
  if (handFits) return;
  if (G.mode === "level" && G.moves <= 0) return setTimeout(outOfMoves, 300);
  if (G.hand.length < 3 && anyWordFits()) return;
  setTimeout(noRoom, 300);
}
function outOfMoves() {
  busy = true;
  card(`<h2>Hamle bitti</h2><div class="goallist">${G.L.goals.filter((g) => G.left[g.type] > 0).map((g) => `<div>${GOALS[g.type].svg}<strong>${G.left[g.type]}</strong>kaldı</div>`).join("")}</div>
    <p>Az kaldı. 5 hamle daha ile bitirebilirsin.</p>
    <button class="btn primary" id="o-ad">Reklam izle: +5 hamle</button><button class="btn" id="o-retry">Bölümü yeniden başlat</button><button class="btn" id="o-home">Ana menü</button>`);
  $("o-ad").onclick = () => fakeAd(() => { G.moves += 5; G.extraMoves += 5; renderTop(); bump($("moves")); afterTurn(); });
  $("o-retry").onclick = () => startLevel(G.L.n); $("o-home").onclick = home;
}
function noRoom() {
  busy = true;
  const canDiscard = G.hand.length > 0;
  card(`<h2>Yer kalmadı</h2><p>Tahtada bu blokları koyacak yer yok.</p>
    <button class="btn primary" id="o-ad">Reklam izle: ${canDiscard ? "bloklarını at" : "yeni harfler al"}</button>
    <button class="btn" id="o-retry">${G.mode === "duel" ? "Bitir" : "Bölümü yeniden başlat"}</button><button class="btn" id="o-home">Ana menü</button>`);
  $("o-ad").onclick = () => fakeAd(() => { if (canDiscard) { G.hand = []; renderHand(); } else { G.grid = Core.freshGrid(G.rnd, { rates: G.L.rates }); respinTiles(); } afterTurn(); });
  $("o-retry").onclick = () => (G.mode === "duel" ? finishDuel() : startLevel(G.L.n)); $("o-home").onclick = home;
}
const GIFTS_PER_STAR = { 1: ["karistir"], 2: ["ipucu"], 3: ["yenile", "joker"] };
function levelWon() {
  busy = true;
  const L = G.L, left = Math.max(0, G.moves - G.extraMoves), ratio = left / L.moves;
  const stars = 1 + (ratio >= 0.25) + (ratio >= 0.5), bonus = G.moves * 20, prev = prog.stars[L.n] || 0;
  const gifts = []; for (let s = prev + 1; s <= stars; s++) gifts.push(...GIFTS_PER_STAR[s]); // only newly earned stars pay out
  gifts.forEach((k) => inv[k]++);
  const final = G.score + bonus;
  prog.stars[L.n] = Math.max(prev, stars); prog.best[L.n] = Math.max(prog.best[L.n] || 0, final); saveAll(); renderBoosters();
  confetti();
  card(`<div class="stars">${[1, 2, 3].map((s, i) => star(s <= stars).replace("<svg", `<svg style="animation-delay:${0.2 + i * 0.25}s"`)).join("")}</div>
    <h2>Bölüm ${L.n + 1} tamam!</h2><div class="big" id="o-score">${G.score}</div>
    <p>${G.moves ? `Kalan ${G.moves} hamle × 20 = +${bonus}` : "Son hamlede bitirdin."}</p>
    ${gifts.length ? `<h3>Hediyeler</h3><div class="gifts">${gifts.map((k, i) => `<div class="gift" style="animation-delay:${0.9 + i * 0.18}s">${icon(k)}<strong>+1</strong>${BOOSTERS[k].name}</div>`).join("")}</div>` : `<p>Bu bölümün hediyelerini almıştın. Daha çok yıldız, daha çok hediye.</p>`}
    <button class="btn primary" id="o-next">Sonraki bölüm</button><button class="btn" id="o-again">Tekrar oyna</button><button class="btn" id="o-map">Bölüm haritası</button>`);
  const sc = $("o-score"), t0 = performance.now(); // count the move bonus up
  (function count(t) { const f = Math.min(1, (t - t0) / 900); sc.textContent = Math.round(G.score + bonus * f); if (f < 1 && !RM) requestAnimationFrame(count); else sc.textContent = final; })(t0);
  $("o-next").onclick = () => intro(L.n + 1); $("o-again").onclick = () => startLevel(L.n); $("o-map").onclick = map;
}
function timeUp() {
  busy = true;
  if (G.extended) return finishDuel();
  const rv = G.rival.at(DUEL_SECONDS);
  card(`<h2>Süre bitti</h2><div class="vs"><div class="${G.score > rv ? "win" : ""}"><strong>${G.score}</strong><span>Sen</span></div><p>–</p><div class="${rv >= G.score ? "win" : ""}"><strong>${rv}</strong><span>${G.rival.name}</span></div></div>
    <p>${G.score > rv ? "Öndesin. Bitir ve kazan." : `Rakibi geçmek için ${rv - G.score + 1} puan lazım.`}</p>
    <button class="btn primary" id="o-ad">Reklam izle: +15 saniye</button><button class="btn" id="o-end">Sonucu gör</button>`);
  $("o-end").onclick = finishDuel;
  $("o-ad").onclick = () => fakeAd(() => { G.extended = true; G.timeLeft = 15; G.running = true; });
}
function finishDuel() {
  busy = true; G.running = false;
  const rv = G.rival.at(DUEL_SECONDS), win = G.score > rv;
  prog.duelBest = Math.max(prog.duelBest || 0, G.score); saveAll();
  if (win) confetti();
  const day = NOW.toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
  const share = `Shapeword Düello · ${day}\n${G.score} – ${rv} ${G.rival.name}\n${win ? "🏆 Kazandım" : "Bu sefer kaybettim"}${G.extended ? " (+15 sn)" : ""}`;
  card(`<h2>${win ? "Kazandın!" : `${G.rival.name} kazandı`}</h2>
    <div class="vs"><div class="${win ? "win" : ""}"><strong>${G.score}</strong><span>Sen</span></div><p>–</p><div class="${win ? "" : "win"}"><strong>${rv}</strong><span>${G.rival.name}</span></div></div>
    <textarea class="share" id="o-share" rows="3" readonly aria-label="Paylaşım metni">${share}</textarea>
    <button class="btn primary" id="o-copy">Sonucu kopyala</button><button class="btn" id="o-again">Tekrar dene</button><button class="btn" id="o-home">Ana menü</button>`);
  $("o-copy").onclick = () => navigator.clipboard.writeText(share).then(() => ($("o-copy").textContent = "Kopyalandı")).catch(() => { $("o-share").select(); $("o-copy").textContent = "Seçildi, kopyala"; });
  $("o-again").onclick = startDuel; $("o-home").onclick = home;
}

$("back").onclick = home;
G = baseState(Core.levelDef(nextLevel()), Math.random, "level"); openScreen(); home();
</script>
